<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="《明日方舟》直到大地变成一颗酸橙主题 Windows 鼠标指针全状态静态总览。"
    />
    <title>酸橙旅行指针 · Windows 全状态静态总览</title>
    <link rel="icon" type="image/svg+xml" href="../assets/orange-icon.svg?v=1" />
    <link rel="stylesheet" href="./cursors.css?v=3" />
    <script src="./cursors.js?v=3" defer></script>
  </head>
  <body>
    <header class="page-header">
      <div class="header-copy">
        <h1>Windows 指针全状态</h1>
        <p class="summary">酸橙旅行主题 · 17 种标准用途 · 静态造型总览</p>
      </div>
      <div class="status-count" aria-label="共 17 种标准指针状态">
        <strong id="cursorCount">17</strong>
        <span>种标准状态<br />全部静态展示</span>
      </div>
    </header>

    <main>
      <section class="catalog" aria-labelledby="catalogTitle">
        <header class="catalog-heading">
          <h2 id="catalogTitle">全部变种</h2>
          <p>后台运行与忙碌暂以静态关键帧展示。</p>
        </header>

        <div class="cursor-grid" id="cursorGrid" aria-label="Windows 指针全状态静态列表"></div>
        <noscript>请启用 JavaScript 以显示指针图稿。</noscript>
      </section>
    </main>

    <footer>
      <p>非官方、非商业的同人概念设计。当前仅为静态造型确认稿。</p>
    </footer>
  </body>
</html>
